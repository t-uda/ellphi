site_name: EllPHi
site_url: https://t-uda.github.io/ellphi/
repo_url: https://github.com/t-uda/ellphi

theme:
  name: material
  logo: assets/logo-icon.png
  favicon: assets/logo-icon.png
  features:
    - navigation.tabs
    - navigation.instant
    - content.code.copy
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google  # or numpy, depending on your codebase style
            show_source: true
            show_root_heading: true

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js

nav:
  - Home: index.md
  - Getting Started: guide/quickstart.md
  - User Guide:
    - TDA Workflow: guide/tda_workflow.md
    - Differentiable Tangency: guide/differentiable.md
    - Notebook Examples: guide/notebooks.md
  - API Reference:
    - Overview: reference/index.md
    - ellphi.geometry: reference/geometry.md
    - ellphi.ellcloud: reference/ellcloud.md
    - ellphi.solver: reference/solver.md
    - ellphi.grad: reference/grad.md
    - ellphi.visualization: reference/visualization.md
  - Design Notes:
    - Algebraic Sigmoid + Newton: algebraic_sigmoid_newton.md
    - Hybrid Solver Tuning: hybrid_tuning.md
    - Eigen Backend Plan: eigen_backend_plan.md
