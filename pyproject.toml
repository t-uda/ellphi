[project]
name = "ellphi"
version = "0.1.2"
description = "Fast ellipse tangency solver"
authors = [
  { name = "Tomoki Uda", email = "tomoki.uda@gmail.com" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
keywords = [
  "topological data analysis",
  "computational geometry",
  "ellipse",
  "tangency",
]

dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "joblib>=1.3",
  "matplotlib>=3.9",
]

[project.scripts]
ellphi = "ellphi.__init__:_main"

[project.urls]
Homepage = "https://github.com/t-uda/ellphi"
Repository = "https://github.com/t-uda/ellphi"

# Development dependencies (PEP 735, managed by uv).
# `uv sync` installs the `dev` group by default; use `--group docs` for docs.
[dependency-groups]
dev = [
  "setuptools>=78.1.1",
  "flake8>=7.3.0,<8",
  "black[jupyter]>=25.1.0,<26",
  "mypy>=1.8,<2",
  "scipy-stubs>=1.16.0.2,<2; python_version >= '3.11'",
  "pytest>=8.4.1,<9",
  "packaging>=25.0,<26",
  "pytest-cov>=7.0.0,<8",
]
docs = [
  "mkdocs>=1.6.0,<2",
  "mkdocs-material>=9.5.0,<10",
  "mkdocstrings[python]==0.25.0",
  "mkdocs-autorefs==1.3.1",
]

[tool.uv]
# numpy 2.5 exposes NDArray as a PEP 695 type alias, which stubtest cannot
# verify on Python >= 3.12 (`ellphi.FloatArray is inconsistent, runtime is
# not a type`). Constrain the development lockfile until stubtest/numpy
# catch up; the published package keeps `numpy>=1.26`.
constraint-dependencies = ["numpy<2.5"]

# The `[tool.poetry]` sections below are kept because the build backend is
# poetry-core: `[tool.poetry.build].script` compiles the C++ tangency backend
# during any PEP 517 build (pip, uv, ...). Dependency management itself is
# handled by uv (see `[dependency-groups]` and uv.lock).
[tool.poetry]
packages = [{ include = "ellphi", from = "src" }]
package-mode = true
include = [
  { path = "src/ellphi/_tangency_cpp_impl.cpp", format = "sdist" },
  { path = "src/ellphi/_tangency_cpp_impl.so", format = "wheel" },
  { path = "src/ellphi/_tangency_cpp_impl.dylib", format = "wheel" },
  { path = "src/ellphi/_tangency_cpp_impl.dll", format = "wheel" },
  { path = "src/ellphi/_tangency_cpp_impl.pyd", format = "wheel" },
  { path = "src/ellphi/*.pyi", format = ["sdist", "wheel"] },
  { path = "src/ellphi/py.typed", format = ["sdist", "wheel"] },
  { path = "scripts/build_tangency_cpp.py", format = ["sdist"] },
]

[tool.poetry.build]
script = "scripts/build_tangency_cpp.py"

[tool.mypy]
mypy_path = "src"

[tool.stubtest]
allowlist = "stubtest-allowlist.txt"

[build-system]
requires = ["poetry-core>=2.0", "setuptools>=78.1.1"]
build-backend = "poetry.core.masonry.api"
