name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Poetry
      run: pip install --upgrade poetry

    - name: Build sdist
      run: poetry build -f sdist

    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: dist-sdist
        path: dist/*.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    env:
      ELLPHI_USE_EIGEN: "1"
      ELLPHI_EIGEN_INCLUDE: "/usr/include/eigen3"
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Eigen headers
      run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

    - name: Install Poetry
      run: pip install --upgrade poetry

    - name: Build wheel
      run: poetry build -f wheel

    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: dist-linux
        path: dist/*.whl

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: pip install --upgrade poetry

    - name: Build wheel
      run: poetry build -f wheel

    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: dist-windows-py${{ matrix.python-version }}
        path: dist/*.whl

  publish:
    needs: [build-sdist, build-linux, build-windows]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: List distribution files
      run: ls -la dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
