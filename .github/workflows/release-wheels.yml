name: Release Wheels

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Publish destination for manual runs"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        run: pip install --upgrade poetry

      - name: Cache Poetry env
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('pyproject.toml') }}-v2

      - name: Build sdist
        run: poetry build --format sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz

  build-linux-wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        arch: ["x86_64", "aarch64"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Poetry
        run: pip install --upgrade poetry

      - name: Cache Poetry env
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('pyproject.toml') }}-v2

      - name: Install project (dev extras)
        run: poetry install --with dev

      - name: Set up QEMU
        if: ${{ matrix.arch == 'aarch64' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build manylinux wheels
        env:
          CIBW_BUILD: "cp310-* cp311-*"
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_SKIP: "*-musllinux*"
        run: poetry run scripts/manylinux_build.sh dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.python-version }}-${{ matrix.arch }}
          path: dist/*.whl

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-sdist
      - build-linux-wheels
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@v1.8.11
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'pypi') }}
        uses: pypa/gh-action-pypi-publish@v1.8.11
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
