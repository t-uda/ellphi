# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ main ]
  pull_request:        # 全 PR

permissions:
  contents: read       # テストに read 権限のみで十分

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    # -- Poetry ------------------------------------------------------
    - name: Install Poetry
      run: pip install --upgrade poetry

    - name: Cache Poetry env
      uses: actions/cache@v3
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('pyproject.toml') }}-v2

    - name: Install project (dev extras)
      run: poetry install

    # -- Lint / Format ----------------------------------------------
    - name: flake8
      run: poetry run flake8 src tests scripts

    - name: black check
      run: poetry run black --check src tests scripts

    # -- Tests ------------------------------------------------------
    - name: pytest
      run: poetry run pytest -q

  # 3.11 限定で mypy
  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Poetry
      run: pip install --upgrade poetry

    - name: Cache Poetry env
      uses: actions/cache@v3
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('pyproject.toml') }}-v2

    - name: Install project (dev extras)
      run: poetry install      # stub も OK

    - name: mypy
      run: poetry run mypy src

    - name: stubtest
      run: MYPYPATH=src poetry run stubtest ellphi --allowlist stubtest-allowlist.txt
