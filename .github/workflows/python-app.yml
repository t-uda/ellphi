# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ main ]
  pull_request:        # 全 PR

permissions:
  contents: read       # テストに read 権限のみで十分

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      ELLPHI_USE_EIGEN: "1"
      ELLPHI_EIGEN_INCLUDE: "/usr/include/eigen3"

    steps:
    - uses: actions/checkout@v4

    - name: Install Eigen headers
      run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

    # -- uv ----------------------------------------------------------
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Check lockfile freshness
      run: uv lock --check

    - name: Install project (dev group)
      run: uv sync --locked

    # -- Lint / Format ----------------------------------------------
    - name: flake8
      run: uv run flake8 src tests scripts

    - name: black check
      run: uv run black --check src tests scripts

    # -- Tests ------------------------------------------------------
    - name: pytest with coverage
      run: uv run pytest --cov=src/ellphi --cov-report=xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  # 3.11 限定で mypy
  typecheck:
    runs-on: ubuntu-latest
    env:
      ELLPHI_USE_EIGEN: "1"
      ELLPHI_EIGEN_INCLUDE: "/usr/include/eigen3"
    steps:
    - uses: actions/checkout@v4

    - name: Install Eigen headers
      run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: "3.11"

    - name: Install project (dev group)
      run: uv sync --locked

    - name: mypy
      run: uv run mypy src

    - name: stubtest
      run: MYPYPATH=src uv run stubtest ellphi --allowlist stubtest-allowlist.txt

  package-test:
    runs-on: ubuntu-latest
    env:
      ELLPHI_USE_EIGEN: "1"
      ELLPHI_EIGEN_INCLUDE: "/usr/include/eigen3"
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Eigen headers
      run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Build package
      run: uv build

    - name: Check sdist content
      run: |
        # Ensure sdist contains C++ source but NO binaries
        tar -tf dist/*.tar.gz > sdist_content.txt
        if ! grep -q "src/ellphi/_tangency_cpp_impl.cpp" sdist_content.txt; then
          echo "Error: C++ source missing from sdist"
          exit 1
        fi
        if grep -q -E "\.(so|dylib|dll|pyd)$" sdist_content.txt; then
          echo "Error: Binary files found in sdist"
          cat sdist_content.txt | grep -E "\.(so|dylib|dll|pyd)$"
          exit 1
        fi
        echo "sdist content check passed."

    - name: Install wheel and test
      run: |
        # Create a fresh venv to test installation
        python -m venv test-env
        source test-env/bin/activate

        # Install the built wheel
        pip install dist/*.whl

        # Install test dependencies (pytest)
        # Note: runtime dependencies (numpy, etc.) are installed by pip automatically from the wheel metadata
        pip install pytest

        # Run tests against the installed package
        # We assume tests are in 'tests/' and we want to avoid importing from local 'src/'
        # So we move to a different directory or explicitely tell pytest where to look
        mkdir -p test_run
        cd test_run
        pytest ../tests

  # Demo dependencies now live in the separate ellphi-demo repository.
  # This job (name kept for branch protection) now verifies that a plain
  # `pip install` from the sdist compiles the C++ backend from source.
  demo-install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Build sdist
      run: uv build --sdist

    - name: Install from sdist and smoke test
      run: |
        python -m venv test-env
        source test-env/bin/activate
        pip install dist/*.tar.gz
        mkdir -p test_run
        cd test_run
        python -m ellphi --build-info
        python -c "from ellphi.solver import has_cpp_backend; assert has_cpp_backend(), 'C++ backend not available'"
