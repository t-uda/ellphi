name: C++ backend smoke test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test tools
        run: python -m pip install . matplotlib pytest

      - name: Run smoke tests
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np
          from ellphi import tangency
          from ellphi.solver import has_cpp_backend

          assert has_cpp_backend(), "C++ backend failed to load"
          p = np.array([0, 0, 1, 0, 0, -1], dtype=float)
          q = np.array([0, 0, 1, 0, 0, -4], dtype=float)
          res = tangency(p, q, backend="cpp")
          print(res)
          PY

      - name: Run backend regression tests
        run: python -m pytest tests/test_cpp_backend.py
